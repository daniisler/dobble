<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · {{APP_NAME}}</title>
<script>try{var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<style>
  .nf { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  .nf .code { font-size:clamp(5rem, 22vw, 10rem); font-weight:800; line-height:1; letter-spacing:.05em; }
  .nf .code span { display:inline-block; width:.8em; height:.8em; border-radius:50%; background:#f7f7f2; border:3px solid var(--accent); vertical-align:-.05em; box-shadow:0 6px 24px var(--shadow); font-size:.9em; line-height:.8em; }
  .nf a.button { text-decoration:none; }
</style>
</head>
<body>
<main class="nf">
  <div class="code">4<span>🔍</span>4</div>
  <h1 style="margin:0;font-size:2rem">Page not found</h1>
  <p class="hint">This card is not in the deck. The page you are looking for does not exist or has moved.</p>
  <a class="button" href="/">Back to the game</a>
</main>
</body>
</html>
